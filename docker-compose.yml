services:
  db:
    # MariaDB LTS. Data lives in a new volume (mariadb_data): an existing
    # mysql_data volume is left untouched, see docs/self-hosting.md to migrate.
    image: mariadb:12.3
    container_name: quiz_db
    # Back up after a server reboot (the app waits for it, see scripts/migrate_db.py)
    restart: unless-stopped
    # The MariaDB image reads MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER
    # and MYSQL_PASSWORD from .env as they are (MARIADB_* aliases)
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
      # Low-memory settings for small servers
      - ./docker/mariadb/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    # No published port: the app reaches it on the internal network (db:3306),
    # backups and scripts use docker exec. Published ports bypass ufw.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Broker for background tasks and Socket.IO message queue; nothing to keep on disk
  redis:
    image: redis:8-alpine
    container_name: quiz_redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: brainnotfound-app
    container_name: quiz_app
    # Loopback only: the host reverse proxy (Nginx, CloudPanel...) forwards to
    # it. APP_BIND=0.0.0.0 in .env to reach it directly (no HTTPS, not advised).
    ports:
      - "${APP_BIND:-127.0.0.1}:5006:5000"
    environment:
      - FLASK_ENV=production
      - TZ=Europe/Paris
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped

  # AI grading, interviews, emails, digest and scheduled backups (Celery, same image)
  worker:
    image: brainnotfound-app  # built by the web service
    pull_policy: never
    container_name: quiz_worker
    command: ["worker"]
    environment:
      - FLASK_ENV=production
      - TZ=Europe/Paris
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  mariadb_data:
  # Former MySQL data, kept for rollback after migrating to MariaDB
  mysql_data:
